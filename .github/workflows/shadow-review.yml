name: Shadow Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '@shadowbot28')
    runs-on: self-hosted
    steps:
      - name: React eyes (seen)
        id: eyes
        env:
          GH_TOKEN: ${{ secrets.SHADOWBOT_GH_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          REACTION_ID=$(gh api repos/${REPO}/issues/comments/${COMMENT_ID}/reactions \
            --method POST -f content='eyes' --jq '.id')
          echo "reaction_id=${REACTION_ID}" >> $GITHUB_OUTPUT

      - name: Notify Shadow
        id: notify
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.issue.title }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          EYES_REACTION_ID: ${{ steps.eyes.outputs.reaction_id }}
          REPO: ${{ github.repository }}
          WEBHOOK_URL: ${{ secrets.CLAWDBOT_WEBHOOK_URL }}
          HOOK_TOKEN: ${{ secrets.CLAWDBOT_HOOK_TOKEN }}
        run: |
          MESSAGE=$(jq -rn \
            --arg pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg repo "$REPO" \
            --arg commenter "$COMMENTER" \
            --arg body "$COMMENT_BODY" \
            --arg cid "$TRIGGER_COMMENT_ID" \
            --arg eid "$EYES_REACTION_ID" \
            '"PR #\($pr) (\($title)) in \($repo): \($commenter) tagged you with: \"\($body)\". When you start: remove the 👀 reaction (gh api repos/\($repo)/issues/comments/\($cid)/reactions/\($eid) --method DELETE) and add 🚀 (gh api repos/\($repo)/issues/comments/\($cid)/reactions --method POST -f content=rocket, save the returned id). Review the PR: gh pr checkout \($pr) --repo \($repo) then gh pr diff \($pr) --repo \($repo). Approve if good (gh pr review \($pr) --repo \($repo) --approve --body ...) or request changes. When done: remove the 🚀 reaction and add 🎉 (gh api repos/\($repo)/issues/comments/\($cid)/reactions --method POST -f content=hooray). Post your verdict as a reply comment on PR \($pr)."')

          JSON_PAYLOAD=$(jq -n \
            --arg message "$MESSAGE" \
            --arg sessionKey "hook:github:pr-${PR_NUMBER}" \
            '{message: $message, name: "GitHub", sessionKey: $sessionKey, deliver: false, model: "anthropic/claude-sonnet-4-6"}')

          curl -f -s -X POST "${WEBHOOK_URL}/hooks/agent" \
            -H "Authorization: Bearer ${HOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      - name: Swap eyes to rocket (working)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SHADOWBOT_GH_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EYES_REACTION_ID: ${{ steps.eyes.outputs.reaction_id }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/${REPO}/issues/comments/${COMMENT_ID}/reactions/${EYES_REACTION_ID} \
            --method DELETE
          gh api repos/${REPO}/issues/comments/${COMMENT_ID}/reactions \
            --method POST -f content='rocket'

      - name: React confused on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SHADOWBOT_GH_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EYES_REACTION_ID: ${{ steps.eyes.outputs.reaction_id }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/${REPO}/issues/comments/${COMMENT_ID}/reactions/${EYES_REACTION_ID} \
            --method DELETE
          gh api repos/${REPO}/issues/comments/${COMMENT_ID}/reactions \
            --method POST -f content='confused'
