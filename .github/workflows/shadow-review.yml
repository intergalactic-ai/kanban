name: Shadow Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '@shadowbot28')
    runs-on: self-hosted
    steps:
      - name: Post eyes comment
        id: eyes
        env:
          GH_TOKEN: ${{ secrets.SHADOWBOT_GH_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          COMMENT_ID=$(gh api repos/${REPO}/issues/${PR_NUMBER}/comments \
            --method POST -f body='👀' --jq '.id')
          echo "comment_id=${COMMENT_ID}" >> $GITHUB_OUTPUT

      - name: Notify Shadow
        id: notify
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.issue.title }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          STATUS_COMMENT_ID: ${{ steps.eyes.outputs.comment_id }}
          WEBHOOK_URL: ${{ secrets.CLAWDBOT_WEBHOOK_URL }}
          HOOK_TOKEN: ${{ secrets.CLAWDBOT_HOOK_TOKEN }}
        run: |
          MESSAGE=$(jq -rn \
            --arg pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg repo "$REPO" \
            --arg commenter "$COMMENTER" \
            --arg body "$COMMENT_BODY" \
            --arg sid "$STATUS_COMMENT_ID" \
            '"PR #\($pr) (\($title)) in \($repo): \($commenter) tagged you with: \"\($body)\". Review the PR branch and diff. (1) Update status comment \($sid) to ⏳ when you start. (2) gh pr checkout \($pr) --repo \($repo) then gh pr diff \($pr) --repo \($repo). (3) gh pr review \($pr) --repo \($repo) --approve or --request-changes with a body. (4) Delete status comment \($sid) and post a reply on PR \($pr) in \($repo) with your verdict ending in ✅"')

          JSON_PAYLOAD=$(jq -n \
            --arg message "$MESSAGE" \
            --arg sessionKey "hook:github:pr-${PR_NUMBER}" \
            '{message: $message, name: "GitHub", sessionKey: $sessionKey, deliver: false, model: "anthropic/claude-sonnet-4-6"}')

          curl -f -s -X POST "${WEBHOOK_URL}/hooks/agent" \
            -H "Authorization: Bearer ${HOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      - name: Update to hourglass
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SHADOWBOT_GH_TOKEN }}
          COMMENT_ID: ${{ steps.eyes.outputs.comment_id }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/${REPO}/issues/comments/${COMMENT_ID} \
            --method PATCH -f body='⏳'

      - name: Update to error on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SHADOWBOT_GH_TOKEN }}
          COMMENT_ID: ${{ steps.eyes.outputs.comment_id }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/${REPO}/issues/comments/${COMMENT_ID} \
            --method PATCH -f body='❌'
