name: Shadow Review

on:
  issue_comment:
    types: [created]

concurrency:
  group: shadow-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '@shadowbot28')
    runs-on: self-hosted
    steps:
      - name: Notify Shadow
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.issue.title }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
          WEBHOOK_URL: ${{ secrets.CLAWDBOT_WEBHOOK_URL }}
          HOOK_TOKEN: ${{ secrets.CLAWDBOT_HOOK_TOKEN }}
        run: |
          MESSAGE=$(jq -rn \
            --arg pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg repo "$REPO" \
            --arg commenter "$COMMENTER" \
            --arg body "$COMMENT_BODY" \
            --arg cid "$COMMENT_ID" \
            '"PR #\($pr) (\($title)) in \($repo) — \($commenter) says: \"\($body)\". FIRST add 👀 reaction to comment \($cid): gh api repos/\($repo)/issues/comments/\($cid)/reactions --method POST -f content=eyes --jq .id (save the reaction id). Then do exactly what was asked: review with gh pr review, or check out the branch (gh pr checkout \($pr) --repo \($repo)) and make commits, or reply to other comments, etc. When you finish, delete the 👀 reaction (gh api repos/\($repo)/issues/comments/\($cid)/reactions/<eyes_id> --method DELETE) and add 🚀 (gh api repos/\($repo)/issues/comments/\($cid)/reactions --method POST -f content=rocket). Post exactly one summary reply on PR \($pr)."')

          JSON_PAYLOAD=$(jq -n \
            --arg message "$MESSAGE" \
            --arg sessionKey "hook:github:pr-${PR_NUMBER}" \
            '{message: $message, name: "GitHub", sessionKey: $sessionKey, deliver: false, model: "anthropic/claude-sonnet-4-6"}')

          curl -f -s -X POST "${WEBHOOK_URL}/hooks/agent" \
            -H "Authorization: Bearer ${HOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      - name: React confused on webhook failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SHADOWBOT_GH_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/${REPO}/issues/comments/${COMMENT_ID}/reactions \
            --method POST -f content='confused'
